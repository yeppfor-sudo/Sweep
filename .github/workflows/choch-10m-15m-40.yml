name: 10m 15m Bear CHoCH TOP40

on:
  schedule:
    - cron: '*/10 * * * *'  # every 10 min
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # increased to 10m because scanning 5 CEX x 40 x 2 TF
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          pip install ccxt pandas requests pytz matplotlib

      - name: Run 10m 15m Bear CHoCH TOP40 Scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          MEXC_API_KEY: ${{ secrets.MEXC_API_KEY }}
          MEXC_SECRET: ${{ secrets.MEXC_SECRET }}
        run: |
          python choch_10m_15m_40.py

      - name: Save history
        if: always()
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@bot.com"
          if [ -f alerts_history.json ]; then
            git add alerts_history.json
            git diff --staged --quiet || git commit -m "update choch history top40" || true
            git push || echo "push failed but ok - check repo Settings > Actions > General > Workflow permissions = Read and write"
          else
            echo "No history file"
          fi
