name: MEXC Liquidity Sweep Bot
on:
  schedule:
    - cron: '5 */2 * * *'  # Every 2h at 05 min = after candle close
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install ccxt pandas requests matplotlib pytz
      - run: python bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
