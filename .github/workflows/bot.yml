name: BEARISH CHoCH 15m 48H TOP REAL TIME PHOTO
on:
  schedule:
    - cron: '1,16,31,46 * * * *'
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install ccxt pandas requests matplotlib pytz
      - run: python bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
      - name: Save history
        run: |
          git config user.name "bot"
          git config user.email "bot@bot.com"
          git add alerts_history.json || true
          git commit -m "update history" || true
          git push || true
