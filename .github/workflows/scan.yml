name: FUT PERP TOP40 CHoCH 10m 15m
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ccxt pandas requests pytz matplotlib
      - env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python -u choch_futures_top40.py
      - if: always()
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@bot.com"
          git add alerts_history.json || true
          git diff --staged --quiet || git commit -m "update history" || true
          git push || true
